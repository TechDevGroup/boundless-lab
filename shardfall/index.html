<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Shardfall</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <style>
      /* the start readout: shown until main.js has pre-built the ground around the start (src/view/streamBoard.js prewarmStart) */
      #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #05080c; color: #8ffcff; z-index: 20;
        font: 13px/1.4 system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
    </style>
    <script type="module" crossorigin src="/boundless-lab/shardfall/assets/shardfall-DNonravS.js"></script>
    <link rel="stylesheet" crossorigin href="/boundless-lab/shardfall/assets/shardfall-BSqdSNwZ.css">
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite"><span id="loadText">Building the ground</span></div>
    <canvas id="stage"></canvas>
    <a id="back" href="../">&larr; Lab</a>
    <div id="hud">
      <div id="title">BOUNDLESS<span id="seed"></span></div>
      <div id="info"></div>
      <div id="status"></div>
    </div>
  </body>
</html>
